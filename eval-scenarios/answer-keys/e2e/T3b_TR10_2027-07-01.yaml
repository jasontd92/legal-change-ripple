  required_spans:
  - *id001
  - file: corpus/triggers/TR-10-wa-noncompete-eshb-1155/2026-09-_rcw-49-62-current-text.txt
    section_label: (3) "Franchisor" and "franchisee" have the same meanings as in RCW 19.100.010.
    quote: '(4) "Noncompetition covenant" includes every written or oral covenant, agreement, or contract by which an employee or independent contractor is prohibited or restrained from engaging in a lawful profession, trade, or business of any kind. A "noncompetition covenant" also includes an agreement that directly or indirectly prohibits the acceptance or transaction of business with a customer. A "noncompetition covenant" does not include: (a) A nonsolicitation agreement; (b) a confidentiality agreement; (c) a covenant prohibiting use or disclosure of trade secrets or inventions; (d) a covenant entered into by a person purchasing or selling the goodwill of a business or otherwise acquiring or disposing of an ownership interest, but only if the person signing the covenant purchases, sells, acquires, or disposes of an interest representing one percent or more of the business; or (e) a covenant entered into by a franchisee when the franchise sale complies with RCW 19.100.020(1).'
    start: 5435
    end: 6418
  - file: corpus/documents/employment/gemma-northcott_customer-non-solicitation-agreement_2023-08-21.md
    section_label: '4.1 Non-Solicitation of Customers. During the Restricted Period, Employee shall '
    quote: Customer Non-Solicitation. For twenty-four (24) months following the end of Employee's employment, Employee shall not, directly or indirectly, solicit, divert or accept plumbing or HVAC business from any customer or Comfort Club member of the Company with whom Employee had material contact during the last eighteen (18) months of employment.
    start: 7519
    end: 7861
  decoy_spans: []
  absence: null
