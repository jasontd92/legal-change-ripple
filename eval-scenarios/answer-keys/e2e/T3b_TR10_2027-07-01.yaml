    - update_template
  facts:
    earnings: null
    threshold_2026_usd: 126858.83
  confidence: high
  pass_rule: affected
  rationale: Section 4.1 bars her from soliciting, diverting, or accepting plumbing or HVAC business for 24 months. Current RCW 49.62 defines a noncompetition covenant to include an agreement that prohibits acceptance or transaction of business with a customer. The clause is a noncompete, not a nonsolicit. Her annualized earnings are not in the file, so whether today's earnings threshold makes it unenforceable is not decided here.
