  pass_rule: affected
  rationale: Template section 6.1 is a one-year post-employment employee non-solicit. SB 699 makes it unlawful to enter into or enforce a contract that is void under section 16600. Sabrina Marchetti's agreement is executed April 7, 2024 and commences April 21, 2024, both after SB 699's January 1, 2024 effective date. Section 6.2 is a trade-secret customer non-solicit that cites section 16600. Citing 6.2 as the violation is a decoy. That decoy is D-TR14-S4-03.
