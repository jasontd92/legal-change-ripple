  - file: corpus/documents/employment/templates/form_technician-employment-agreement_california_rev-2017.md
    section_label: 6. NON-SOLICITATION
    quote: 6.1 Non-Solicitation of Employees. During the Employee's employment with the Company and for a period of one (1) year immediately following termination of employment for any reason, the Employee agrees not to solicit, recruit, encourage, or attempt to hire or engage any employee of the Company, or to solicit any employee to leave the Company's employment or reduce the scope of their employment, without the prior express written consent of the Company. This restriction applies whether such solicitation is direct or indirect, and whether undertaken by the Employee personally or through a third party, intermediary, or competing business.
    start: 16259
    end: 16901
