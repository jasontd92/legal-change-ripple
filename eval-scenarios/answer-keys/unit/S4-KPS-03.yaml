  rationale: PO-2025-0231 incorporates Keystone's terms as published October 2019. The operative price clause is the 2019 section 3, which begins 'All prices are subject to change unless otherwise specified on Seller's quotation.' The June 2025 section 3 begins 'All quoted prices are subject to adjustment absent contrary indication on Seller's quote.' Citing the 2025 text for this PO is the wrong version. PO-2025-0914 correctly pins June 2025; that pin is not a license to use the 2025 text on the earlier PO.
notes: Version pin. No trigger. Both versions pass duties through; the words of section 3 differ.
