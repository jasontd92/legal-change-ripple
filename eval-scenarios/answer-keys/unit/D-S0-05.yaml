    file: corpus/documents/customers/residential-terms/meridian-comfort-club_membership-terms_california_2024-06-01.md
    section_label: 7. AUTOMATIC RENEWAL
    quote: Automatic Renewal. Your Comfort Club membership renews automatically each month at the then-current monthly membership fee (currently $19.95) and will be charged to your payment method on file until you cancel. You may cancel at any time by calling Member Services at (916) 555-0199, Monday through Friday, 8:00 a.m. to 5:00 p.m., or by writing to Meridian at 2150 Harbor Point Drive, Suite 400, Sacramento, CA 95833. Meridian may change the monthly membership fee upon thirty (30) days' notice sent to the email address on file; continued membership after the effective date constitutes acceptance of the new fee.
    start: 8186
    end: 8800
  new:
    file: corpus/documents/customers/residential-terms/meridian-comfort-club_membership-terms_california_2026-08-01.md
    section_label: 4. AUTOMATIC RENEWAL
    quote: 'Automatic Renewal; Your Consent. By checking the box labeled ''I agree to automatic renewal'' at enrollment, you give your express affirmative consent to the automatic renewal terms: your membership renews monthly at $21.95 until you cancel. Cancellation. You may cancel online at any time at www.meridianpha.com/ca/cancel using the ''Cancel Membership'' button, without being required to speak with a representative, or by calling (916) 555-0199. Annual Reminder. At least once each year, Meridian will send you a reminder describing your membership, the frequency and amount of charges, and how to cancel. Price Changes. Meridian will notify you of any increase in the membership fee at least seven (7) and no more than thirty (30) days before the increase takes effect, together with instructions for how to cancel.'
    start: 4296
    end: 5110
