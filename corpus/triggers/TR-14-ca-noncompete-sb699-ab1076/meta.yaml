expected_relevance: 'POSITIVE (reclassified from control 2026-09-29). SB 699: void post-employment restrictive clauses entered
  into or enforced after 2024-01-01 are unlawful, including employee non-solicits (Castellano offer letter section 12; CA
  technician template section 6.1 and its signed instances). AB 1076: notice due 2024-02-14 for pre-existing void noncompete
  clauses; whether employee non-solicits count is unsettled, so the five pre-deadline technician instances are needs review.
  In-term and trade-secret-limited clauses are decoys.'
