group: TR-10-wa-noncompete-eshb-1155
domain: noncompete
summary: Washington voids all noncompetition covenants (effective 2027-06-30), requires notice by 2027-10-01, treats forfeiture
  and repayment as noncompetes, and keeps a 1%-ownership sale-of-business exception.
