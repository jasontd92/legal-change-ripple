    - {id: 2026-09-_rcw-49-62-current-text, src: T-WA-RCW4962-CURRENT, status: in_force_until_2027-06-30, effective: 2024-06-06, expect: {must: ['18 months', 'void and unenforceable']}}
    - {id: 2026-03-23_eshb-1155-session-law, src: T-WA-ESHB1155, status: enacted_not_yet_effective, effective: 2027-06-30, expect: {must: ['regardless of when', 'October 1, 2027', 'June 30, 2027', 'one percent or more', 'repay, or forfeit']}}
