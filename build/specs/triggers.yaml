- group: TR-03-adcvd-copper-pipe-mexico
  domain: tariff
  role: control
  expected_relevance: "CONTROL. No corpus document specifies Mexican-origin copper pipe or tube, and Meridian imports directly only from Vietnam. Expected result: no direct exposure; at most a monitor note that distributors pricing at time of shipment (Keystone, Lakeshore) could pass through any duty change."
