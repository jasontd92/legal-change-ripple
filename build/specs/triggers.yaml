    - {id: 2026-02-20_eo-14389-ending-ieepa-tariffs, src: T-EO14389, status: effective, effective: 2026-02-24, expect: {must: ['shall no longer be in effect']}}
    - {id: 2026-02-20_proclamation-11012-section-122-surcharge, src: T-P11012, status: expired, effective: 2026-02-24, expires: 2026-07-24, expect: {must: ['150', '10 percent']}}
    - {id: 2026-07-08_cbp-ieepa-refunds-pra-notice, src: T-CBP-REFUND-PRA, status: final, effective: 2026-07-08, expect: {must: ['[Rr]efund']}}
