# Trigger groups -> versions. Each version is a raw source id plus deterministic expectations.
# expect: must (regexes that must match) / must_not (regexes that must not match)
# pairs: [older, newer]; the diff between them must contain added:/removed: regexes (checked on changed lines only)
- group: TR-01-copper-section-232
  domain: tariff
  summary: Section 232 copper duties. Three dated versions; each changes base, rate or scope.
  versions:
    - {id: 2025-02-25_eo-14220-investigation, src: T-EO14220, status: final, effective: 2025-02-25, expect: {must: ['investigation']}}
    - {id: 2025-07-30_proclamation-10962, src: T-P10962, status: effective, effective: 2025-08-01,
       note: "Annex is image-only in the Federal Register. Per the White House annex images it covers HTS 7406-7419, including 7411 (copper tubes and pipes), 7412 (tube/pipe fittings) and 7418.20 (sanitary ware); not 8481 (valves), 8419 (water heaters) or 8415 (air conditioners).",
       expect: {must: ['non-copper content', 'No drawback', '50 percent', 'June 30, 2026']}}
    - {id: 2025-07-30_proclamation-10962_ANNEX-SCOPE-derived, src: "derived:p10962_annex_scope.txt", status: derived_scope_note, effective: 2025-08-01, expect: {must: ['7411\.10\.10', '7412\.10\.00', 'NOT LISTED: refined copper cathode'], must_not: ['8481\.80\.\d\d ']}}
    - {id: 2025-07-31_cbp-csms-65794272, src: T-CSMS-65794272, status: guidance, effective: 2025-08-01, expect: {must: ['[Cc]opper', '9903\.78']}}
    - {id: 2026-04-02_proclamation-11021, src: T-P11021, status: effective, effective: 2026-04-06, expect: {must: ['full customs value', 'Annex I-A']}}
    - {id: 2026-06-01_proclamations-11021-11032_ANNEX-SCOPE-derived-ocr-partial, src: "derived:p11021_p11032_annex_scope.txt", status: derived_scope_note, effective: 2026-06-08, expect: {must: ['UNVERIFIED', 'FULL CUSTOMS VALUE', 'Annex I-C']}}
    - {id: 2026-06-01_proclamation-11032, src: T-P11032, status: effective, effective: 2026-06-08, expect: {must: ['95 percent shall be modified to 85 percent', '[Rr]esidential']}}
    - {id: 2026-07-20_proclamation-11045-aluminum-DISTRACTOR, src: T-P11045, status: effective, effective: 2026-07-20, distractor: true, expect: {must: ['[Aa]luminum']}}
    - {id: 2026-07-30_dpa-critical-minerals-DISTRACTOR, src: T-DPA-CRITMIN, status: final, effective: 2026-07-30, distractor: true, expect: {must: ['[Cc]ritical']}}
- group: TR-02-ieepa-tariffs-scotus
