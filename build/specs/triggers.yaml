  versions:
    - {id: 2026-09-21_preliminary-results, src: T-ADCVD-MEX-2026, status: preliminary, effective: 2026-09-21, expect: {must: ['[Cc]opper [Pp]ipe and [Tt]ube', '[Pp]reliminary']}}
- group: TR-10-wa-noncompete-eshb-1155
